<style>
:root{
  --paper:#ECE8E0; --sheet:#F3F0EA; --ink:#141414; --muted:#6D6A63;
  --accent:#2A3F94; --vermilion:#C2432B;
  --rule:rgba(20,20,20,.9); --ease:cubic-bezier(.2,.8,.2,1);
  --H:min(47vh,33vw); --cy:41%;
  --sans:"Inter Tight",system-ui,sans-serif; --serif:"Cormorant Garamond","Newsreader",Georgia,serif; --body:"Newsreader",Georgia,serif;
}
@media (max-width:767px){ :root{ --H:min(68vw,40svh); --cy:43%; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
@media (pointer:fine){ html,body,button,a{cursor:none} }
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.lbl{font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.box{display:inline-flex;align-items:center;height:21px;padding:0 8px;border:1px solid var(--rule)}

/* paper grain */
.grain{position:fixed;inset:0;z-index:40;pointer-events:none;mix-blend-mode:multiply;opacity:.6;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .42 0 0 0 0 .38 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;height:76px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;color:var(--accent);z-index:30}
.tl{display:flex;align-items:center;gap:16px}
.tl .ln{display:block;width:40px;height:1px;background:currentColor}
.tr{display:flex;align-items:center;gap:30px}
.lang{display:inline-flex;border:1px solid currentColor}
.lang button{padding:7px 10px;font:600 10.5px/1 var(--sans);letter-spacing:.14em;color:var(--accent)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.snd{display:inline-flex;align-items:center;gap:8px;border:1px solid currentColor;padding:6px 10px;color:var(--accent)}
.snd .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}
.snd.on .dot{background:currentColor;animation:sndp 2.4s ease-in-out infinite}
@keyframes sndp{50%{transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){.snd.on .dot{animation:none}}

/* halftone words */
.ht{position:fixed;z-index:1;writing-mode:vertical-rl;font-weight:800;line-height:1.02;letter-spacing:.02em;pointer-events:none;
  color:transparent;-webkit-text-fill-color:transparent;
  background:radial-gradient(circle at 50% 50%,rgba(64,82,138,.55) 0 36%,transparent 40%) 0 0/3px 3px,linear-gradient(rgba(110,122,160,.26),rgba(110,122,160,.26));
  -webkit-background-clip:text;background-clip:text}
.ht.l{left:2.4vw;top:13vh;font-size:min(11vh,7.4vw)}
.ht.r{right:2.4vw;top:9vh;font-size:min(19vh,12.5vw)}
@media (max-width:767px){ .ht{opacity:.8} .ht.l{font-size:11vw;top:11vh} .ht.r{font-size:20vw;top:9vh} }

.floor{position:fixed;z-index:2;left:50%;transform:translateX(-50%);top:calc(var(--cy) + var(--H)*.47);width:min(96vw,calc(var(--H)*3.6));height:calc(var(--H)*.26);pointer-events:none;
  background:radial-gradient(50% 50% at 50% 40%,rgba(40,32,20,.30),rgba(40,32,20,.10) 55%,transparent 72%)}

/* shelf */
.shelf{position:fixed;left:0;right:0;top:calc(var(--cy) - var(--H)/2 - 50px);height:calc(var(--H) + 100px);perspective:1400px;perspective-origin:50% 50%;z-index:10;touch-action:pan-y}
.stage{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.tape{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;top:calc(var(--H)/-2);height:var(--H);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px;overflow:hidden}
.face svg{display:block;width:100%;height:100%}
.face::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--shade,0);pointer-events:none}
.sp{width:var(--ws);left:calc(var(--ws)/-2);transform:translateZ(calc(var(--d)/2))}
.cv{width:var(--d);left:calc(var(--d)/-2);transform:rotateY(90deg) translateZ(calc(var(--ws)/2));box-shadow:0 34px 60px -30px rgba(20,16,10,.6)}

.play{position:fixed;z-index:14;width:42px;height:42px;border-radius:50%;border:1px solid var(--accent);background:rgba(236,232,224,.8);display:flex;align-items:center;justify-content:center;transform:scale(0);will-change:transform}
.play i{display:block;width:0;height:0;border-left:12px solid var(--accent);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}

/* caption */
.cap{position:fixed;z-index:12;left:50%;transform:translateX(-50%);top:calc(var(--cy) + var(--H)/2 + 4.2vh);display:grid;gap:10px;justify-items:center;pointer-events:none}
.mask{position:relative;overflow:hidden;width:min(80vw,640px);text-align:center}
.mask span{display:block;width:100%}
.mask span.out{position:absolute;left:0;top:0}
.c-title{font:700 clamp(30px,3.6vw,50px)/1.1 var(--serif);color:var(--accent);padding-bottom:.1em}
.c-sub{color:var(--accent);font-size:9.5px;letter-spacing:.24em}
.c-rule{width:18px;height:1px;background:var(--accent)}
.c-year{font:500 10.5px/1.4 var(--sans);letter-spacing:.08em;color:var(--ink)}
.arrow{position:fixed;z-index:14;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent);top:calc(var(--cy) + var(--H)/2 + 4.2vh - 2px)}
.arrow.prev{left:calc(50% - min(19vw,250px) - 22px)} .arrow.next{left:calc(50% + min(19vw,250px) - 22px)}
.arrow svg{width:24px;height:12px;stroke:currentColor;fill:none;stroke-width:1.2}

/* timeline */
.tline{position:fixed;z-index:14;left:36px;right:36px;bottom:64px;height:40px;color:var(--accent)}
.tline .axis{position:absolute;left:0;right:0;top:12px;height:1px;background:currentColor;opacity:.75}
.tline .tk{position:absolute;top:12px;width:1px;background:currentColor;opacity:.4;height:7px}
.tline .tk.mj{height:13px;opacity:.75}
.tline .tn{position:absolute;top:30px;font:500 9.5px/1 var(--sans);letter-spacing:.06em;transform:translateX(-50%);white-space:nowrap}
.tline .tn:first-of-type{transform:none} .tline .tn.last{transform:translateX(-100%)}
.tline .dot{position:absolute;top:12px;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--accent)}
.tline .hit{position:absolute;inset:-6px 0 -6px 0}

.foot{position:fixed;z-index:14;left:36px;right:36px;bottom:24px;display:flex;justify-content:space-between;color:var(--accent)}
.foot a{pointer-events:auto}

/* cursor */
.cur{position:fixed;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;z-index:100;pointer-events:none;display:none;will-change:transform}
@media (pointer:fine){ .cur{display:block} }
.cur .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--ink);background:transparent;transition:transform .5s var(--ease),background-color .4s var(--ease),border-color .4s var(--ease)}
.cur .dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink);transition:transform .4s var(--ease)}
.cur .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font:600 10px/1.25 var(--sans);letter-spacing:.1em;transform:scale(0);transition:transform .45s var(--ease)}
.cur.spine .ring{transform:scale(.72)}
.cur.btn .ring{transform:scale(.55)} .cur.btn .dot{transform:scale(0)}
.cur.open .ring{transform:scale(1.75);background:var(--accent);border-color:var(--accent)} .cur.open .dot{transform:scale(0)} .cur.open .lab{transform:scale(1)}

/* ---------- detail sheet ---------- */
.detail{position:fixed;inset:0;z-index:60;background:var(--sheet);visibility:hidden;overflow-x:hidden;overflow-y:auto}
.detail .close{position:absolute;left:36px;top:28px;z-index:3;color:var(--accent);border-color:var(--accent);height:26px;padding:0 11px}
.detail .brand{position:absolute;right:36px;top:26px;color:var(--accent);display:flex;align-items:center;gap:12px;z-index:3}
.detail .brand i{display:block;width:34px;height:1px;background:currentColor}
.dgrid{padding:104px 6vw 44px 7vw;min-height:100%;display:flex;flex-direction:column;gap:clamp(18px,3vh,34px);justify-content:center}
.dm{overflow:hidden;padding-bottom:.12em}
.dhead{display:flex;flex-direction:column;gap:12px}
.d-sub{color:var(--accent)}
.d-title{margin:0;font:700 clamp(40px,5.2vw,78px)/1 var(--serif);letter-spacing:-.01em;color:var(--accent)}

.dbody{display:flex;gap:clamp(20px,3vw,44px);align-items:flex-start}
.dcover{flex:none;width:var(--cw);height:var(--ch);box-shadow:0 26px 50px -28px rgba(20,16,10,.55)}
.dcover svg{display:block;width:100%;height:100%;overflow:visible}
.dread{flex:none}
.dctrl{display:flex;align-items:center;gap:18px;margin-top:16px;color:var(--accent)}
.dctrl button{width:44px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--accent);color:var(--accent)}
.dctrl button:disabled{opacity:.3;pointer-events:none}
.dctrl svg{width:22px;height:10px;stroke:currentColor;fill:none;stroke-width:1.3}

.book{position:relative;width:var(--bw);height:var(--ph);perspective:2600px}
.pbase,.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.leaf{transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.6,0,.2,1)}
.pf,.pb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#FBF8F1;border:1px solid rgba(20,20,20,.14)}
.pf{border-radius:0 3px 3px 0;background-image:linear-gradient(90deg,rgba(20,16,10,.16),transparent 9%)}
.pb{transform:rotateY(180deg);border-radius:3px 0 0 3px;background-image:linear-gradient(270deg,rgba(20,16,10,.16),transparent 9%)}
.pbase{background:#F6F2E8;border:1px solid rgba(20,20,20,.14)}
.pbase.bl{left:0;border-radius:3px 0 0 3px;background-image:linear-gradient(270deg,rgba(20,16,10,.16),transparent 9%)}
.pbase.br{border-radius:0 3px 3px 0;background-image:linear-gradient(90deg,rgba(20,16,10,.16),transparent 9%)}
.pgin{position:absolute;inset:0;padding:9% 9% 12% 10%;overflow:auto;font:400 clamp(11px,calc(var(--pw)/25),17px)/1.55 var(--body);color:#26231f;scrollbar-width:thin}
.pgin.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.pgin p{margin:0 0 .8em}
.pgin h3.pt.sm{font-size:14px;line-height:1.4;font-weight:600;margin:0 0 1em}
.pgin:has(h3.pt.sm){padding-top:6.5%;padding-bottom:9%}
.pgin .btns{display:flex;flex-wrap:wrap;gap:8px}
.pgin .bx{margin:0 8px 6px 0}
.pgin .rs{margin:0 0 1em;padding-top:.7em;border-top:1px solid rgba(20,20,20,.16)}
.pgin .rs .rl{color:var(--accent);margin-bottom:.4em}
.pgin .rs table{width:100%;border-collapse:collapse;margin:0 0 .8em}
.pgin .rs th,.pgin .rs td{padding:.28em 0;border-bottom:1px solid rgba(20,20,20,.12);vertical-align:baseline;font-size:.88em}
.pgin .rs th{text-align:left;font-weight:400;color:#55514a;padding-right:1em}
.pgin .rs td{text-align:right;font:600 1.02em/1.2 var(--serif);color:#141414;white-space:nowrap}
.pgin .rs td small{display:block;font:400 .72em/1.3 var(--sans);letter-spacing:.04em;color:#7a766e;margin-top:2px}
.pgin .rs p.hk{font-size:.8em;line-height:1.5;margin:0;color:#3a3630;}
.pe{color:var(--accent);margin-bottom:.9em;font-size:9.5px}
.pt{margin:0 0 .7em;font:700 clamp(22px,calc(var(--pw)/12),38px)/1.05 var(--serif);color:#141414}
.pgin ul{margin:0;padding:0 0 0 1.1em} .pgin li{margin-bottom:.55em}
.tg{display:flex;flex-wrap:wrap;gap:.5em}
.tg span{font:500 .72em/1 var(--sans);border:1px solid rgba(20,20,20,.3);border-radius:999px;padding:.55em 1em;color:#3a372f}
.sub{font:500 .78em/1.3 var(--sans);color:var(--muted);margin:-.2em 0 1.1em}
.period{font:600 .62em/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.role{font:700 1.35em/1.15 var(--serif);margin:.35em 0 .1em}
.co{font:600 .62em/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.9em;display:block}
.bx{display:inline-flex;align-items:center;gap:.8em;margin-top:.5em;padding:.8em 1.2em;border:1px solid var(--accent);color:var(--accent);font:600 .68em/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.bx:hover{background:var(--accent);color:#fff}
.pcard{border-top:1px solid rgba(20,20,20,.2);padding-top:.8em;margin-top:.4em}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.35em 1em;font-size:.88em;margin-top:1em}
.facts b{font:600 .72em/1.9 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.folio{position:absolute;bottom:4.5%;font:500 9.5px/1 var(--sans);letter-spacing:.14em;color:var(--muted)}
.pf .folio{right:9%} .pb .folio{left:10%}
.mark{font:700 clamp(18px,calc(var(--pw)/14),28px)/1 var(--serif);color:var(--accent);letter-spacing:.04em}

      noise(t, 0.55, 'bandpass', 260, 1400, 0.7, 0.22, 0.22); noise(t + 0.05, 0.4, 'highpass', 1200, 3500, 0.5, 0.06, 0.2);
      thump(t + 0.5, 120, 50, 0.4, 0.36); noise(t + 0.5, 0.12, 'lowpass', 900, 300, 0.6, 0.2, 0.01);
    },
    page: function (t) {
      noise(t, 0.38, 'bandpass', 1700, 4200, 0.6, 0.20, 0.09); noise(t + 0.12, 0.22, 'highpass', 2800, 5200, 0.7, 0.07, 0.04); noise(t + 0.34, 0.08, 'bandpass', 900, 500, 1, 0.08, 0.005);
    }
  };
  var api = { enabled: true, play: function (k) { if (!api.enabled || !init()) return; if (ctx.state === 'suspended') ctx.resume(); kinds[k](ctx.currentTime + 0.01); } };
  ['shelf', 'open', 'page'].forEach(function (k) { window.addEventListener('sfx-' + k, function () { api.play(k); }); });
  return api;
})();
</script>

<script>
(function () {
  /* Music: EN = "Mist in the Mountains", FR = "Contemplation" (Maarten Schellekens). Starts on load, keeps playing inside books. */
  var SRC = { en: 'audio/en.mp3', fr: 'audio/fr.mp3' }, VOL = 0.5;
  var btns = [].slice.call(document.querySelectorAll('.snd'));
  var tr = {}, on = true, cur = null, fades = {};
  function lang() { return document.documentElement.lang === 'en' ? 'en' : 'fr'; }
  function get(k) { if (!tr[k]) { var a = new Audio(SRC[k]); a.loop = true; a.preload = 'auto'; a.volume = 0; tr[k] = a; } return tr[k]; }
  function fade(a, to, ms, done) {
    clearInterval(fades[a.src]); var from = a.volume, t0 = performance.now();
    fades[a.src] = setInterval(function () {
      var k = Math.min(1, (performance.now() - t0) / ms); a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k >= 1) { clearInterval(fades[a.src]); if (done) done(); }
    }, 40);
  }
  function label() {
    var fr = lang() === 'fr';
    btns.forEach(function (b) {
      b.setAttribute('aria-pressed', String(on)); b.classList.toggle('on', on);
      b.setAttribute('aria-label', fr ? (on ? 'Couper la musique' : 'Activer la musique') : (on ? 'Mute the music' : 'Play the music'));
      b.querySelector('.stx').textContent = fr ? 'SON' : 'SOUND';
    });
  }
  var blocked = false;
  function play(k, ms) {
    var a = get(k); cur = k;
    var p = a.play();
    if (p && p.catch) p.catch(function () { blocked = true; });
    fade(a, VOL, ms || 1800);
  }
  function switchTo(k) {
    if (!on || k === cur) return;
    var old = cur && tr[cur]; if (old) fade(old, 0, 1200, function () { old.pause(); });
    play(k, 1800);
  }
  function setOn(v) {
    on = v; label(); SFX.enabled = v; try { sessionStorage.setItem('snd', v ? 'on' : 'off'); } catch (e) {}
    if (v) play(lang(), 1500); else { var a = cur && tr[cur]; if (a) fade(a, 0, 600, function () { a.pause(); }); }
  }
  try { if (sessionStorage.getItem('snd') === 'off') on = false; } catch (e) {}
  SFX.enabled = on;
  btns.forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); setOn(!on); }); });
  /* autoplay on load; if the browser refuses, start at the first user gesture */
  function unlock(e) {
    if (!on) return cleanup();
    if (e && e.target && e.target.closest && e.target.closest('.snd')) return;
    var a = tr[cur || lang()];
    if (!a || a.paused) { play(lang(), 1500); }
    cleanup();
  }
  function cleanup() { ['pointerdown', 'keydown', 'touchstart'].forEach(function (n) { window.removeEventListener(n, unlock, true); }); }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (n) { window.addEventListener(n, unlock, true); });
  if (on) play(lang(), 2500);
  document.addEventListener('visibilitychange', function () {
    var a = cur && tr[cur]; if (!a || !on) return;
    if (document.hidden) a.pause(); else a.play().catch(function () {});
  });
  new MutationObserver(function () { label(); switchTo(lang()); }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  label();
})();
</script>
